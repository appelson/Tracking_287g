name: Run Script

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository using your custom TOKEN
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install -r .github/workflows/requirements.txt

    - name: Run script.py
      run: |
        python script.py

    - name: Run deduplicate.py
      run: |
        python deduplicate.py

    - name: Commit and push changes
      env:
        TOKEN: ${{ secrets.TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        git config --local user.name "github-actions"
        git config --local user.email "actions@users.noreply.github.com"
        # Ensure remote URL uses TOKEN for authentication
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git
        git add -A
        git commit -m "Auto-commit from GitHub Actions at $(date -u)" || echo "No changes to commit"
        git push
